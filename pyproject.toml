[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Published to PyPI as "homebench" (the name "localbench" was already taken).
[project]
name = "homebench"
version = "0.4.0"
description = "A single-command terminal UI that benchmarks the local LLMs you already have — speed, memory, and quality — on your own laptop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ email = "aiwinsyou@gmail.com" }]
keywords = [
    "llm", "benchmark", "ollama", "local-llm", "tui", "evaluation",
    "tokens-per-second", "leaderboard", "textual",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.60,<2.0",
    "rich>=13.0",
    "httpx>=0.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
yaml = ["pyyaml>=5.1"]
dev = ["pytest>=7.0", "pytest-httpx>=0.22", "pyyaml>=5.1"]
publish = ["build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/david-g-3654/homebench"
Repository = "https://github.com/david-g-3654/homebench"
Issues = "https://github.com/david-g-3654/homebench/issues"

[project.scripts]
homebench = "homebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
