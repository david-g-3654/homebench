[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localbench"
version = "0.1.0"
description = "A single-command terminal UI that benchmarks the local LLMs you already have — speed, memory, and quality — on your own laptop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ email = "aiwinsyou@gmail.com" }]
keywords = [
    "llm", "benchmark", "ollama", "local-llm", "tui", "evaluation",
    "tokens-per-second", "leaderboard", "textual",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.60,<2.0",
    "rich>=13.0",
    "httpx>=0.24",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-httpx>=0.22"]

[project.urls]
Homepage = "https://github.com/localbench/localbench"
Issues = "https://github.com/localbench/localbench/issues"

[project.scripts]
localbench = "localbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
